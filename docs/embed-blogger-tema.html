<!--
  Perubahan untuk TEMA Blogger (Tema > Edit HTML) yang memakai iframe statis class 'gas-app-container'.
  Tema Blogger adalah XML: jangan mengganti seluruh isi tema, cukup dua perubahan berikut.

  1) Di dalam <b:skin>, pada aturan .gas-app-container, ganti
       position: absolute;
     menjadi
       position: fixed;

  2) Ganti baris <iframe ... class='gas-app-container' .../> dengan blok di bawah
     (URL /exec sudah sama dengan yang dipakai sekarang; ganti bila deployment berubah).
-->
  <iframe allowfullscreen='true' class='gas-app-container' id='gas-app' src='https://script.google.com/macros/s/AKfycbyXSJ8AhFMmWWbUk3Q3JpdUJfay5ApA6OJv24oxKBaQr7svK4sfIzGBFhpQgcJGFDEY1w/exec'/>
  <script>
  //<![CDATA[
  (function () {
    var f = document.getElementById('gas-app');
    if (!f) return;

    // Teruskan parameter tertentu dari alamat Blogger ke web app (misalnya ?form=daftar atau ?ref=wa).
    var DITERUSKAN = ['form', 'ref', 'utm_source', 'admin'];
    var asal = new URLSearchParams(window.location.search);
    var tujuan = new URLSearchParams();
    DITERUSKAN.forEach(function (k) {
      if (asal.has(k)) tujuan.set(k, asal.get(k));
    });
    if (tujuan.toString()) f.src = f.src.split('?')[0] + '?' + tujuan.toString();

    // Saat keyboard ponsel muncul, iframe dipas ke area layar yang masih terlihat (di atas keyboard),
    // lalu kembali penuh saat keyboard ditutup. Form di dalamnya memakai ukuran ini untuk menata popup.
    var vv = window.visualViewport;
    if (!vv) return;
    var pas = function () {
      f.style.top = vv.offsetTop + 'px';
      f.style.height = vv.height + 'px';
    };
    vv.addEventListener('resize', pas);
    vv.addEventListener('scroll', pas);
    pas();
  })();
  //]]>
  </script>
