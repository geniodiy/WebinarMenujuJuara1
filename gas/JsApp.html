<script>
  (function () {
    'use strict';

    var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    var SELISIH_WIB = 7 * 3600 * 1000;
    var CADANGAN = { narahubung_nama: 'Lily', narahubung_wa: '6287838862882', instagram_1: 'genio_institute', instagram_2: 'genio.diy', bonus_teks: 'Materi Kelas OSN' };

    var data = window.DATA_AWAL || {};
    var config = data.config;
    var konten = data.konten;
    var param = data.param || {};
    window.APP_CONFIG = config;

    function $(id) { return document.getElementById(id); }

    function el(tag, kelas, teks) {
      var e = document.createElement(tag);
      if (kelas) e.className = kelas;
      if (teks != null) e.textContent = teks;
      return e;
    }

    function pad(n) { return (n < 10 ? '0' : '') + n; }

    /** Format waktu WIB tanpa bergantung pada zona waktu perangkat. */
    function formatWib(ms, denganJam) {
      if (ms == null) return '';
      var d = new Date(ms + SELISIH_WIB);
      var teks = HARI[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + BULAN[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
      if (denganJam) teks += ' pukul ' + pad(d.getUTCHours()) + '.' + pad(d.getUTCMinutes()) + ' WIB';
      return teks;
    }

    function jamWib(ms) {
      var d = new Date(ms + SELISIH_WIB);
      return pad(d.getUTCHours()) + '.' + pad(d.getUTCMinutes()) + ' WIB';
    }

    function peng(kunci) {
      var p = konten && konten.pengaturan ? konten.pengaturan : {};
      return p[kunci] || CADANGAN[kunci] || '';
    }

    function setTeks(id, teks) {
      var e = $(id);
      if (e && teks) e.textContent = teks;
    }

    /* Gambar dari Drive: alamat lh3 (cepat) dengan thumbnail Drive sebagai cadangan. */
    function urlGambar(dasar, lebar) {
      return dasar + '=w' + lebar;
    }

    function pasangCadangan(img, dasar, lebar) {
      var id = String(dasar).split('/d/')[1];
      function ganti() {
        img.onerror = null;
        img.removeAttribute('srcset');
        if (id) img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + lebar;
      }
      img.onerror = ganti;
      if (img.complete && img.getAttribute('src') && img.naturalWidth === 0) ganti();
    }

    function aturGambar(img, dasar, lebarList, sizes) {
      img.src = urlGambar(dasar, lebarList[lebarList.length - 1]);
      img.srcset = lebarList.map(function (w) { return urlGambar(dasar, w) + ' ' + w + 'w'; }).join(', ');
      img.sizes = sizes;
      pasangCadangan(img, dasar, lebarList[lebarList.length - 1]);
    }

    function formatWa(nomor) {
      var lokal = String(nomor).replace(/^62/, '0');
      return lokal.replace(/^(\d{4})(\d{4})(\d+)$/, '$1-$2-$3');
    }

    function tautanWa(nomor, pesan) {
      return 'https://wa.me/' + encodeURIComponent(nomor) + (pesan ? '?text=' + encodeURIComponent(pesan) : '');
    }

    function tautanLuar(teks, href, kelas) {
      var a = el('a', kelas, teks);
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener';
      return a;
    }

    /* ---------- Pembuka ---------- */

    // KEPUTUSAN: bila poster belum ada, judul_acara dipecah otomatis: sebelum ":" menjadi label (#MenujuJuara | Eps. 1),
    // sesudahnya menjadi judul, dan dua kata terakhir judul diberi kotak gradien seperti poster.
    function isiJudul() {
      var judul = peng('judul_acara');
      if (!judul) return;
      var bagian = judul.split(':');
      var label = bagian.length > 1 ? bagian.shift().trim() : '';
      var utama = bagian.join(':').trim();
      var m = label.match(/^(.*?)\s+(Eps\.?\s*\d+)$/i);
      if (m) {
        $('label-acara').textContent = m[1];
        $('label-eps').textContent = m[2];
        $('label-eps').hidden = false;
      } else if (label) {
        $('label-acara').textContent = label;
        $('label-eps').hidden = true;
      }
      var kata = utama.split(/\s+/);
      if (kata.length >= 3) {
        $('judul-awal').textContent = kata.slice(0, -2).join(' ');
        $('judul-sorot').textContent = kata.slice(-2).join(' ');
      } else {
        $('judul-awal').textContent = utama;
        $('judul-sorot').hidden = true;
      }
    }

    /** Kata terakhir tiap bagian tagline dicetak tebal, seperti poster. */
    function isiTagline() {
      var t = peng('tagline');
      if (!t) return;
      var wadah = $('tagline');
      wadah.textContent = '';
      t.split(',').forEach(function (bagian, i, semua) {
        var kata = bagian.trim().split(/\s+/);
        var akhir = kata.pop();
        if (kata.length) wadah.appendChild(document.createTextNode(kata.join(' ') + ' '));
        wadah.appendChild(el('b', null, akhir));
        if (i < semua.length - 1) wadah.appendChild(document.createTextNode(', '));
      });
    }

    function isiPembuka() {
      isiJudul();
      isiTagline();
      setTeks('tanggal-teks', peng('tanggal_teks'));
      setTeks('jam-teks', peng('jam_teks'));
      setTeks('media-teks', peng('media_teks'));
      var adaPoster = !!(konten && konten.poster_url);
      var poster = $('poster');
      // Biasanya src sudah ditanam server di HTML; diatur di sini hanya setelah Muat ulang.
      if (adaPoster && !poster.getAttribute('src')) aturGambar(poster, konten.poster_url, [600, 1080], '(max-width: 760px) 100vw, 736px');
      else if (adaPoster) pasangCadangan(poster, konten.poster_url, 1080);
      $('wadah-poster').hidden = !adaPoster;
      $('judul-cadangan').hidden = adaPoster;
      if (peng('judul_acara')) $('judul-halaman').textContent = 'Webinar ' + peng('judul_acara');
    }

    /** Mengecilkan tanggal pelaksanaan sampai muat satu baris di samping label Gratis. */
    function pasTanggal() {
      var t = $('tanggal-teks');
      var ruang = t.parentNode.clientWidth;
      t.style.fontSize = '';
      var lebar = t.scrollWidth;
      if (lebar > ruang && ruang > 0) {
        var ukuran = parseFloat(getComputedStyle(t).fontSize) * ruang / lebar;
        t.style.fontSize = Math.max(10, Math.floor(ukuran * 10) / 10) + 'px';
      }
    }

    function teksHitungMundur() {
      if (!config || config.fase !== 'daftar' || config.sisa_hari == null) return null;
      if (config.sisa_hari <= 0) return { awal: 'Pendaftaran ditutup ', tebal: 'hari ini', akhir: ' pukul ' + jamWib(config.pendaftaran_tutup) };
      return { awal: 'Pendaftaran ditutup dalam ', tebal: config.sisa_hari + ' hari', akhir: '' };
    }

    var detakHitungMundur = null;

    /**
     * Hitung mundur berjalan memakai selisih jam server, bukan jam perangkat yang bisa salah.
     * Jam tutup berlaku sampai akhir menitnya, sama seperti di server.
     */
    function isiHitungMundur() {
      clearInterval(detakHitungMundur);
      var wadah = $('hitung-mundur');
      var aktif = config && config.fase === 'daftar' && config.sisa_hari != null && config.pendaftaran_tutup;
      wadah.hidden = !aktif;
      if (!aktif) return;
      var selisihJam = config.jam_server - Date.now();
      var akhir = config.pendaftaran_tutup + 60 * 1000;
      $('hm-tanggal').textContent = 'Ditutup ' + formatWib(config.pendaftaran_tutup, true);

      function detak() {
        var sisa = Math.max(0, akhir - (Date.now() + selisihJam));
        var s = Math.floor(sisa / 1000);
        var nilai = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
        ['hm-hari', 'hm-jam', 'hm-menit', 'hm-detik'].forEach(function (id, i) { $(id).textContent = pad(nilai[i]); });
        $('hm-teks').textContent = 'Pendaftaran ditutup dalam ' + nilai[0] + ' hari ' + nilai[1] + ' jam ' + nilai[2] + ' menit.';
        if (sisa === 0) {
          clearInterval(detakHitungMundur);
          config.fase = 'tutup';
          config.form.pendaftaran = 'TUTUP';
          wadah.hidden = true;
          renderBilah();
        }
      }
      detak();
      detakHitungMundur = setInterval(detak, 1000);
    }

    /* ---------- Agenda dan narasumber ---------- */

    function labelContoh() {
      return el('span', 'label-contoh', 'Contoh');
    }

    function kelasSasaran(s) {
      if (/^siswa$/i.test(s)) return 'label-sasaran siswa';
      if (/orang tua|guru/i.test(s)) return 'label-sasaran ortu';
      return 'label-sasaran';
    }

    function renderAgenda() {
      var daftar = konten ? konten.agenda : [];
      $('bagian-agenda').hidden = !daftar.length;
      var ol = $('daftar-agenda');
      ol.textContent = '';
      daftar.forEach(function (a, i) {
        var li = el('li');
        li.appendChild(el('span', 'agenda-nomor', String(i + 1)));
        var isi = el('div', 'agenda-isi');
        var meta = el('div', 'agenda-meta');
        if (a.sasaran) meta.appendChild(el('span', kelasSasaran(a.sasaran), a.sasaran));
        if (a.jam) meta.appendChild(el('span', 'label-jam', a.jam));
        if (a.contoh) meta.appendChild(labelContoh());
        if (meta.children.length) isi.appendChild(meta);
        isi.appendChild(el('h3', null, a.judul));
        if (a.deskripsi) isi.appendChild(el('p', null, a.deskripsi));
        li.appendChild(isi);
        ol.appendChild(li);
      });
      siapkanAlurAgenda();
    }

    /* Alur agenda: garis penghubung terisi sesuai posisi scroll, nomor menyala saat garis mencapainya. */
    var alur = { ol: null, nomor: [], posisi: [], isi: null, menunggu: false, siap: false };

    function ukurAlur() {
      if (!alur.ol || alur.nomor.length < 2) return;
      // offsetTop tidak terpengaruh animasi muncul (transform), jadi posisi garis tetap tepat.
      alur.posisi = alur.nomor.map(function (n) { return n.parentNode.offsetTop + n.offsetTop + n.offsetHeight / 2; });
      var garis = alur.isi.parentNode;
      garis.style.top = alur.posisi[0] + 'px';
      garis.style.height = (alur.posisi[alur.posisi.length - 1] - alur.posisi[0]) + 'px';
      perbaruiAlur();
    }

    function perbaruiAlur() {
      alur.menunggu = false;
      if (!alur.ol || alur.nomor.length < 2) return;
      // Titik acuan sedikit di bawah tengah layar: garis terisi sampai titik itu.
      var acuan = window.innerHeight * 0.6 - alur.ol.getBoundingClientRect().top;
      var awal = alur.posisi[0];
      var panjang = alur.posisi[alur.posisi.length - 1] - awal;
      alur.isi.style.height = Math.max(0, Math.min(panjang, acuan - awal)) + 'px';
      alur.isi.classList.toggle('mulai', acuan > awal);
      alur.nomor.forEach(function (n, i) {
        var aktif = acuan >= alur.posisi[i];
        if (aktif !== n.classList.contains('aktif')) n.classList.toggle('aktif', aktif);
      });
    }

    function siapkanAlurAgenda() {
      var ol = $('daftar-agenda');
      alur.ol = ol;
      alur.nomor = Array.prototype.slice.call(ol.querySelectorAll('.agenda-nomor'));
      if (alur.nomor.length < 2) {
        alur.nomor.forEach(function (n) { n.classList.add('aktif'); });
        return;
      }
      var garis = el('div', 'agenda-garis');
      garis.setAttribute('aria-hidden', 'true');
      alur.isi = el('div', 'agenda-garis-isi');
      alur.isi.appendChild(el('span', 'agenda-titik'));
      garis.appendChild(alur.isi);
      ol.appendChild(garis);
      if (!alur.siap) {
        alur.siap = true;
        window.addEventListener('scroll', function () {
          if (!alur.menunggu) {
            alur.menunggu = true;
            window.requestAnimationFrame(perbaruiAlur);
          }
        }, { passive: true });
        window.addEventListener('resize', ukurAlur);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(ukurAlur);
      }
      window.requestAnimationFrame(ukurAlur);
    }

    function daftarPrestasi(item, batas) {
      var ul = el('ul', 'daftar-prestasi');
      (item.prestasi_binaan || []).slice(0, batas).forEach(function (p) { ul.appendChild(el('li', null, p)); });
      return ul;
    }

    function bukaDetail(item, pemicu) {
      var isi = $('detail-isi');
      isi.textContent = '';
      var h = el('h2', null, item.nama_lengkap);
      h.id = 'detail-nama';
      isi.appendChild(h);
      isi.appendChild(el('p', 'jabatan', [item.jabatan, item.room ? 'Room ' + item.room : ''].filter(Boolean).join(' · ')));
      if (item.ringkasan) isi.appendChild(el('p', null, item.ringkasan));
      if ((item.prestasi_binaan || []).length) {
        isi.appendChild(el('h3', null, 'Prestasi siswa binaan'));
        isi.appendChild(daftarPrestasi(item, 100));
      }
      bukaLapisan('lapisan-detail', pemicu);
    }

    /* Kata medali dan gelar dipisah dari nama ajang supaya bisa ditonjolkan sebagai lencana. */
    var POLA_SOROT = /gold medal|silver medal|bronze medal|best overall|absolute winner|medali emas|medali perak|medali perunggu|juara umum|juara \d+/gi;
    function pecahPrestasi(teks) {
      var sorot = [];
      var ajang = String(teks).replace(POLA_SOROT, function (m) { sorot.push(m); return ' '; });
      ajang = ajang.replace(/\s*[&,+]\s*(?=[&,+]|\s*$)/g, ' ').replace(/^[\s&,+-]+|[\s&,+-]+$/g, '').replace(/\s{2,}/g, ' ');
      return { sorot: sorot, ajang: ajang };
    }

    function sorotPrestasi(teks) {
      var bagian = pecahPrestasi(teks);
      var kotak = el('div', 'prestasi-sorot');
      kotak.appendChild(el('span', 'prestasi-ikon'));
      var isi = el('div', 'prestasi-isi');
      // KEPUTUSAN: kalimat pengantar tetap, karena kolom prestasi hanya berisi nama prestasinya.
      isi.appendChild(el('p', 'prestasi-pengantar', 'Pembimbing siswa peraih'));
      if (bagian.sorot.length) {
        var lencana = el('p', 'prestasi-lencana');
        bagian.sorot.forEach(function (s, i) { lencana.appendChild(el('span', 'lencana-sorot lencana-' + (i + 1), s)); });
        isi.appendChild(lencana);
      }
      if (bagian.ajang) isi.appendChild(el('p', 'prestasi-ajang', bagian.ajang));
      kotak.appendChild(isi);
      return kotak;
    }

    function renderNarasumber() {
      var daftar = konten ? konten.narasumber : [];
      $('bagian-narasumber').hidden = !daftar.length;
      var wadah = $('daftar-narasumber');
      wadah.textContent = '';
      daftar.forEach(function (n) {
        var kartu = el('article', 'narasumber');
        var teks = el('div', 'narasumber-teks');
        var papan = el('div', 'narasumber-papan');
        var h = el('h3', null, n.nama_lengkap);
        if (n.contoh) { h.appendChild(document.createTextNode(' ')); h.appendChild(labelContoh()); }
        papan.appendChild(h);
        if (n.jabatan) papan.appendChild(el('p', 'jabatan', n.jabatan));
        if (n.foto_url) {
          // Foto potongan berlatar transparan di atas kotak biru: kepala keluar dari kotak, papan nama menutup bagian bawah.
          var figur = el('div', 'narasumber-figur');
          var bingkai = el('div', 'narasumber-bingkai');
          bingkai.appendChild(el('span', 'narasumber-latar'));
          var img = el('img', 'narasumber-foto');
          img.alt = 'Foto ' + n.nama_lengkap;
          img.loading = 'lazy';
          img.decoding = 'async';
          img.width = 800;
          img.height = 1000;
          aturGambar(img, n.foto_url, [400, 800], '(max-width: 640px) 90vw, 340px');
          bingkai.appendChild(img);
          figur.appendChild(bingkai);
          figur.appendChild(papan);
          kartu.appendChild(figur);
        } else {
          teks.appendChild(papan);
        }
        var prestasi = (n.prestasi_binaan || [])[0];
        if (prestasi) teks.appendChild(sorotPrestasi(prestasi));
        else if (n.ringkasan) teks.appendChild(el('p', 'narasumber-ringkasan', n.ringkasan));
        kartu.appendChild(teks);
        wadah.appendChild(kartu);
      });
    }

    /* ---------- Footer ---------- */

    function renderKaki() {
      var wa = peng('narahubung_wa');
      $('tautan-narahubung').href = tautanWa(wa);
      $('narahubung-nomor').textContent = formatWa(wa);
      $('narahubung-nama').textContent = '(' + peng('narahubung_nama') + ')';
      ['instagram_1', 'instagram_2'].forEach(function (k, i) {
        var akun = peng(k);
        var t = $('tautan-ig-' + (i + 1));
        t.hidden = !akun;
        t.href = 'https://www.instagram.com/' + encodeURIComponent(akun) + '/';
        t.textContent = '@' + akun;
      });
    }

    /* ---------- Tombol floating ---------- */

    function tombolBilah(teks, aktif) {
      var b = el('button', 'tombol tombol-utama', teks);
      b.type = 'button';
      if (!aktif) b.disabled = true;
      return b;
    }

    /** Fase belum_buka, daftar, dan tutup. Fase hari_h dan selesai dibuat di Fase 6. */
    function renderBilah() {
      var wadah = $('bilah');
      wadah.textContent = '';
      var isi = el('div', 'bilah-isi');
      var info = el('div', 'bilah-info');
      var nama = peng('narahubung_nama');
      var aksi;

      if (!config) {
        info.appendChild(el('strong', null, 'Status pendaftaran belum terbaca'));
        info.appendChild(el('span', null, 'Hubungi narahubung bila ada kendala.'));
        aksi = tautanLuar('Hubungi narahubung', tautanWa(peng('narahubung_wa')), 'tombol tombol-utama');
      } else if (config.fase === 'belum_buka') {
        info.appendChild(el('strong', null, 'Gratis'));
        info.appendChild(el('span', null, 'Bonus ' + peng('bonus_teks')));
        aksi = tombolBilah('Pendaftaran dibuka ' + formatWib(config.pendaftaran_buka, false), false);
      } else if (config.fase === 'daftar') {
        var t = teksHitungMundur();
        info.appendChild(el('strong', null, 'Gratis'));
        info.appendChild(el('span', null, t ? t.awal + t.tebal + t.akhir : 'Bonus ' + peng('bonus_teks')));
        aksi = tombolBilah('Daftar', true);
        aksi.classList.remove('tombol-utama');
        aksi.classList.add('tombol-detak', 'tombol-daftar');
        aksi.addEventListener('click', bukaForm);
      } else {
        info.appendChild(el('strong', null, 'Pendaftaran Ditutup'));
        var kecil = el('span', null, 'Sudah daftar tapi belum masuk grup? ');
        kecil.appendChild(tautanLuar('Hubungi ' + nama, tautanWa(peng('narahubung_wa'))));
        info.appendChild(kecil);
        aksi = tombolBilah('Pendaftaran Ditutup', false);
      }
      isi.appendChild(info);
      isi.appendChild(aksi);
      wadah.appendChild(isi);
    }

    /** Bila berkas form tidak termuat (misalnya tertempel tidak utuh), tampilkan pesan, jangan diam. */
    function bukaForm() {
      try {
        FormDaftar.buka();
      } catch (err) {
        var info = document.querySelector('.bilah-info span');
        if (info) {
          info.textContent = 'Form belum bisa dibuka. Muat ulang halaman, atau hubungi ' + peng('narahubung_nama') + '. (' + (err && err.message ? err.message : err) + ')';
        }
        if (window.console) console.error(err);
      }
    }

    /* ---------- Lapisan ---------- */

    var pemicuLapisan = {};

    function bukaLapisan(id, pemicu) {
      var l = $(id);
      pemicuLapisan[id] = pemicu || document.activeElement;
      l.hidden = false;
      document.documentElement.classList.add('fd-terbuka');
      var fokus = l.querySelector('input, [data-tutup]');
      if (fokus) fokus.focus();
    }

    function tutupLapisan(id) {
      var l = $(id);
      if (l.hidden) return;
      l.hidden = true;
      document.documentElement.classList.remove('fd-terbuka');
      var p = pemicuLapisan[id];
      if (p && p.focus) p.focus();
    }

    function siapkanLapisan(id) {
      var l = $(id);
      l.addEventListener('click', function (e) {
        // Panel admin hanya ditutup lewat tombolnya agar tidak tertutup karena ketukan tak sengaja.
        var latar = e.target === l && id !== 'lapisan-admin';
        if (latar || e.target.closest('[data-tutup]')) tutupLapisan(id);
      });
      l.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') tutupLapisan(id);
      });
    }

    /* ---------- Admin ---------- */

    function bukaAdmin() {
      bukaLapisan('lapisan-admin', $('tombol-admin'));
      PanelAdmin.buka($('admin-akar'));
    }

    function siapkanAdmin() {
      $('tombol-admin').addEventListener('click', bukaAdmin);
    }

    /* ---------- Animasi muncul saat digulir ---------- */

    var SASARAN_MUNCUL = '.strip-tanggal, .info-kartu, .hitung-mundur, .narahubung, .bagian > h2, .agenda li, .narasumber, .kaki';

    /** Hanya elemen yang awalnya di luar layar yang dianimasikan; yang sudah terlihat dibiarkan. */
    function siapkanMunculGulir() {
      if (!('IntersectionObserver' in window)) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var pengamat = new IntersectionObserver(function (entri) {
        entri.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.classList.add('terlihat');
          pengamat.unobserve(e.target);
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      Array.prototype.forEach.call(document.querySelectorAll(SASARAN_MUNCUL), function (n) {
        if (n.closest('[hidden]') || n.getBoundingClientRect().top < window.innerHeight) return;
        n.classList.add('gulir-muncul');
        pengamat.observe(n);
      });
    }

    /* ---------- Muat ulang bila gagal ---------- */

    function renderSemua() {
      window.APP_CONFIG = config;
      isiPembuka();
      isiHitungMundur();
      renderAgenda();
      renderNarasumber();
      renderKaki();
      renderBilah();
      $('pita-contoh').hidden = !(konten && konten.ada_contoh);
      $('galat-konten').hidden = !!(konten && config);
    }

    function muatUlang() {
      var tombol = $('tombol-muat-ulang');
      if (!window.google || !google.script || !google.script.run) return;
      tombol.disabled = true;
      tombol.textContent = 'Memuat…';
      var sisa = 2;
      function selesai() {
        if (--sisa > 0) return;
        tombol.disabled = false;
        tombol.textContent = 'Muat ulang';
        renderSemua();
      }
      google.script.run.withSuccessHandler(function (r) { if (r && r.ok) config = r.data; selesai(); }).withFailureHandler(selesai).getConfig();
      google.script.run.withSuccessHandler(function (r) { if (r && r.ok) konten = r.data; selesai(); }).withFailureHandler(selesai).getContent();
    }

    renderSemua();
    siapkanMunculGulir();
    pasTanggal();
    window.addEventListener('resize', pasTanggal);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(pasTanggal);
    siapkanLapisan('lapisan-poster');
    siapkanLapisan('lapisan-detail');
    siapkanLapisan('lapisan-admin');
    siapkanAdmin();
    $('tombol-poster').addEventListener('click', function () {
      var besar = $('poster-besar');
      besar.src = urlGambar(konten.poster_url, 1600);
      pasangCadangan(besar, konten.poster_url, 1600);
      bukaLapisan('lapisan-poster', $('tombol-poster'));
    });
    $('tombol-muat-ulang').addEventListener('click', muatUlang);

    if (param.form === 'daftar') bukaForm();
    else if (param.admin === '1') bukaAdmin();
  })();
</script>
