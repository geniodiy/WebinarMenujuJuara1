<script>
  (function () {
    'use strict';

    var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    var SELISIH_WIB = 7 * 3600 * 1000;
    var CADANGAN = { narahubung_nama: 'Lily', narahubung_wa: '6287838862882', instagram_1: 'genio_institute', instagram_2: 'genio.diy', bonus_teks: 'Materi Kelas OSN' };

    var data = window.DATA_AWAL || {};
    var config = data.config;
    var konten = data.konten;
    var param = data.param || {};
    window.APP_CONFIG = config;

    function $(id) { return document.getElementById(id); }

    function el(tag, kelas, teks) {
      var e = document.createElement(tag);
      if (kelas) e.className = kelas;
      if (teks != null) e.textContent = teks;
      return e;
    }

    function pad(n) { return (n < 10 ? '0' : '') + n; }

    /** Format waktu WIB tanpa bergantung pada zona waktu perangkat. */
    function formatWib(ms, denganJam) {
      if (ms == null) return '';
      var d = new Date(ms + SELISIH_WIB);
      var teks = HARI[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + BULAN[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
      if (denganJam) teks += ' pukul ' + pad(d.getUTCHours()) + '.' + pad(d.getUTCMinutes()) + ' WIB';
      return teks;
    }

    function jamWib(ms) {
      var d = new Date(ms + SELISIH_WIB);
      return pad(d.getUTCHours()) + '.' + pad(d.getUTCMinutes()) + ' WIB';
    }

    /** false bila admin menyembunyikan bagian ini (konten.tampil dari server). */
    function bagianTampil(nama) {
      return !(konten && konten.tampil && konten.tampil[nama] === false);
    }

    function peng(kunci) {
      var p = konten && konten.pengaturan ? konten.pengaturan : {};
      return p[kunci] || CADANGAN[kunci] || '';
    }

    function setTeks(id, teks) {
      var e = $(id);
      if (e && teks) e.textContent = teks;
    }

    /* Gambar dari Drive: alamat lh3 (cepat) dengan thumbnail Drive sebagai cadangan. */
    function urlGambar(dasar, lebar) {
      return dasar + '=w' + lebar;
    }

    function pasangCadangan(img, dasar, lebar) {
      var id = String(dasar).split('/d/')[1];
      function ganti() {
        img.onerror = null;
        img.removeAttribute('srcset');
        if (id) img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + lebar;
      }
      img.onerror = ganti;
      if (img.complete && img.getAttribute('src') && img.naturalWidth === 0) ganti();
    }

    function aturGambar(img, dasar, lebarList, sizes) {
      img.src = urlGambar(dasar, lebarList[lebarList.length - 1]);
      img.srcset = lebarList.map(function (w) { return urlGambar(dasar, w) + ' ' + w + 'w'; }).join(', ');
      img.sizes = sizes;
      pasangCadangan(img, dasar, lebarList[lebarList.length - 1]);
    }

    function formatWa(nomor) {
      var lokal = String(nomor).replace(/^62/, '0');
      return lokal.replace(/^(\d{4})(\d{4})(\d+)$/, '$1-$2-$3');
    }

    function tautanWa(nomor, pesan) {
      return 'https://wa.me/' + encodeURIComponent(nomor) + (pesan ? '?text=' + encodeURIComponent(pesan) : '');
    }

    function tautanLuar(teks, href, kelas) {
      var a = el('a', kelas, teks);
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener';
      return a;
    }

    /* ---------- Pembuka ---------- */

    // KEPUTUSAN: bila poster belum ada, judul_acara dipecah otomatis: sebelum ":" menjadi label (#MenujuJuara | Eps. 1),
    // sesudahnya menjadi judul, dan dua kata terakhir judul diberi kotak gradien seperti poster.
    function isiJudul() {
      var judul = peng('judul_acara');
      if (!judul) return;
      var bagian = judul.split(':');
      var label = bagian.length > 1 ? bagian.shift().trim() : '';
      var utama = bagian.join(':').trim();
      var m = label.match(/^(.*?)\s+(Eps\.?\s*\d+)$/i);
      if (m) {
        $('label-acara').textContent = m[1];
        $('label-eps').textContent = m[2];
        $('label-eps').hidden = false;
      } else if (label) {
        $('label-acara').textContent = label;
        $('label-eps').hidden = true;
      }
      var kata = utama.split(/\s+/);
      if (kata.length >= 3) {
        $('judul-awal').textContent = kata.slice(0, -2).join(' ');
        $('judul-sorot').textContent = kata.slice(-2).join(' ');
      } else {
        $('judul-awal').textContent = utama;
        $('judul-sorot').hidden = true;
      }
    }

    /** Kata terakhir tiap bagian tagline dicetak tebal, seperti poster. */
    function isiTagline() {
      var t = peng('tagline');
      if (!t) return;
      var wadah = $('tagline');
      wadah.textContent = '';
      t.split(',').forEach(function (bagian, i, semua) {
        var kata = bagian.trim().split(/\s+/);
        var akhir = kata.pop();
        if (kata.length) wadah.appendChild(document.createTextNode(kata.join(' ') + ' '));
        wadah.appendChild(el('b', null, akhir));
        if (i < semua.length - 1) wadah.appendChild(document.createTextNode(', '));
      });
    }

    function isiPembuka() {
      isiJudul();
      isiTagline();
      setTeks('tanggal-teks', peng('tanggal_teks'));
      setTeks('jam-teks', peng('jam_teks'));
      setTeks('media-teks', peng('media_teks'));
      var adaPoster = !!(konten && konten.poster_url);
      var poster = $('poster');
      // Biasanya src sudah ditanam server di HTML; diatur di sini hanya setelah Muat ulang.
      if (adaPoster && !poster.getAttribute('src')) aturGambar(poster, konten.poster_url, [600, 1080], '(max-width: 760px) 100vw, 736px');
      else if (adaPoster) pasangCadangan(poster, konten.poster_url, 1080);
      $('wadah-poster').hidden = !adaPoster;
      $('judul-cadangan').hidden = adaPoster;
      if (peng('judul_acara')) $('judul-halaman').textContent = 'Webinar ' + peng('judul_acara');
    }

    /** Mengecilkan tanggal pelaksanaan sampai muat satu baris di samping label Gratis. */
    function pasTanggal() {
      var t = $('tanggal-teks');
      var ruang = t.parentNode.clientWidth;
      t.style.fontSize = '';
      var lebar = t.scrollWidth;
      if (lebar > ruang && ruang > 0) {
        var ukuran = parseFloat(getComputedStyle(t).fontSize) * ruang / lebar;
        t.style.fontSize = Math.max(10, Math.floor(ukuran * 10) / 10) + 'px';
      }
    }

    function teksHitungMundur() {
      if (!config || config.fase !== 'daftar' || config.sisa_hari == null) return null;
      if (config.sisa_hari <= 0) return { awal: 'Pendaftaran ditutup ', tebal: 'hari ini', akhir: ' pukul ' + jamWib(config.pendaftaran_tutup) };
      return { awal: 'Pendaftaran ditutup dalam ', tebal: config.sisa_hari + ' hari', akhir: '' };
    }

    var detakHitungMundur = null;

    /**
     * Hitung mundur berjalan memakai selisih jam server, bukan jam perangkat yang bisa salah.
     * Jam tutup berlaku sampai akhir menitnya, sama seperti di server.
     */
    function isiHitungMundur() {
      clearInterval(detakHitungMundur);
      var wadah = $('hitung-mundur');
      var aktif = config && config.fase === 'daftar' && config.sisa_hari != null && config.pendaftaran_tutup;
      wadah.hidden = !aktif;
      if (!aktif) return;
      var selisihJam = config.jam_server - Date.now();
      var akhir = config.pendaftaran_tutup + 60 * 1000;
      $('hm-tanggal').textContent = 'Ditutup ' + formatWib(config.pendaftaran_tutup, true);

      function detak() {
        var sisa = Math.max(0, akhir - (Date.now() + selisihJam));
        var s = Math.floor(sisa / 1000);
        var nilai = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
        ['hm-hari', 'hm-jam', 'hm-menit', 'hm-detik'].forEach(function (id, i) { $(id).textContent = pad(nilai[i]); });
        $('hm-teks').textContent = 'Pendaftaran ditutup dalam ' + nilai[0] + ' hari ' + nilai[1] + ' jam ' + nilai[2] + ' menit.';
        if (sisa === 0) {
          clearInterval(detakHitungMundur);
          config.fase = 'tutup';
          config.form.pendaftaran = 'TUTUP';
          wadah.hidden = true;
          renderBilah();
        }
      }
      detak();
      detakHitungMundur = setInterval(detak, 1000);
    }

    /* ---------- Agenda dan narasumber ---------- */

    function labelContoh() {
      return el('span', 'label-contoh', 'Contoh');
    }

    function kelasSasaran(s) {
      if (/^siswa$/i.test(s)) return 'label-sasaran siswa';
      if (/orang tua|guru/i.test(s)) return 'label-sasaran ortu';
      return 'label-sasaran';
    }

    function renderAgenda() {
      var daftar = konten ? konten.agenda : [];
      $('bagian-agenda').hidden = !daftar.length;
      var ol = $('daftar-agenda');
      ol.textContent = '';
      daftar.forEach(function (a, i) {
        var li = el('li');
        li.appendChild(el('span', 'agenda-nomor', String(i + 1)));
        var isi = el('div', 'agenda-isi');
        var meta = el('div', 'agenda-meta');
        if (a.sasaran) meta.appendChild(el('span', kelasSasaran(a.sasaran), a.sasaran));
        if (a.jam) meta.appendChild(el('span', 'label-jam', a.jam));
        if (a.contoh) meta.appendChild(labelContoh());
        if (meta.children.length) isi.appendChild(meta);
        isi.appendChild(el('h3', null, a.judul));
        if (a.deskripsi) isi.appendChild(el('p', null, a.deskripsi));
        li.appendChild(isi);
        ol.appendChild(li);
      });
      siapkanAlurAgenda();
    }

    /* Alur agenda: garis penghubung terisi sesuai posisi scroll, nomor menyala saat garis mencapainya. */
    var alur = { ol: null, nomor: [], posisi: [], isi: null, menunggu: false, siap: false };

    function ukurAlur() {
      if (!alur.ol || alur.nomor.length < 2) return;
      // offsetTop tidak terpengaruh animasi muncul (transform), jadi posisi garis tetap tepat.
      alur.posisi = alur.nomor.map(function (n) { return n.parentNode.offsetTop + n.offsetTop + n.offsetHeight / 2; });
      var garis = alur.isi.parentNode;
      garis.style.top = alur.posisi[0] + 'px';
      garis.style.height = (alur.posisi[alur.posisi.length - 1] - alur.posisi[0]) + 'px';
      perbaruiAlur();
    }

    function perbaruiAlur() {
      alur.menunggu = false;
      if (!alur.ol || alur.nomor.length < 2) return;
      // Titik acuan sedikit di bawah tengah layar: garis terisi sampai titik itu.
      var acuan = window.innerHeight * 0.6 - alur.ol.getBoundingClientRect().top;
      var awal = alur.posisi[0];
      var panjang = alur.posisi[alur.posisi.length - 1] - awal;
      alur.isi.style.height = Math.max(0, Math.min(panjang, acuan - awal)) + 'px';
      alur.isi.classList.toggle('mulai', acuan > awal);
      alur.nomor.forEach(function (n, i) {
        var aktif = acuan >= alur.posisi[i];
        if (aktif !== n.classList.contains('aktif')) n.classList.toggle('aktif', aktif);
      });
    }

    function siapkanAlurAgenda() {
      var ol = $('daftar-agenda');
      alur.ol = ol;
      alur.nomor = Array.prototype.slice.call(ol.querySelectorAll('.agenda-nomor'));
      if (alur.nomor.length < 2) {
        alur.nomor.forEach(function (n) { n.classList.add('aktif'); });
        return;
      }
      var garis = el('div', 'agenda-garis');
      garis.setAttribute('aria-hidden', 'true');
      alur.isi = el('div', 'agenda-garis-isi');
      alur.isi.appendChild(el('span', 'agenda-titik'));
      garis.appendChild(alur.isi);
      ol.appendChild(garis);
      if (!alur.siap) {
        alur.siap = true;
        window.addEventListener('scroll', function () {
          if (!alur.menunggu) {
            alur.menunggu = true;
            window.requestAnimationFrame(perbaruiAlur);
          }
        }, { passive: true });
        window.addEventListener('resize', ukurAlur);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(ukurAlur);
      }
      window.requestAnimationFrame(ukurAlur);
    }

    /* Kata medali dan gelar dipisah dari nama ajang supaya bisa ditonjolkan sebagai lencana. */
    var POLA_SOROT = /gold medal|silver medal|bronze medal|best overall|absolute winner|medali emas|medali perak|medali perunggu|juara umum|juara \d+/gi;
    function pecahPrestasi(teks) {
      var sorot = [];
      var ajang = String(teks).replace(POLA_SOROT, function (m) { sorot.push(m); return ' '; });
      ajang = ajang.replace(/\s*[&,+]\s*(?=[&,+]|\s*$)/g, ' ').replace(/^[\s&,+-]+|[\s&,+-]+$/g, '').replace(/\s{2,}/g, ' ');
      return { sorot: sorot, ajang: ajang };
    }

    function sorotPrestasi(teks) {
      var bagian = pecahPrestasi(teks);
      var kotak = el('div', 'prestasi-sorot');
      kotak.appendChild(el('span', 'prestasi-ikon'));
      var isi = el('div', 'prestasi-isi');
      // KEPUTUSAN: kalimat pengantar tetap, karena kolom prestasi hanya berisi nama prestasinya.
      isi.appendChild(el('p', 'prestasi-pengantar', 'Pembimbing siswa peraih'));
      if (bagian.sorot.length) {
        var lencana = el('p', 'prestasi-lencana');
        bagian.sorot.forEach(function (s, i) { lencana.appendChild(el('span', 'lencana-sorot lencana-' + (i + 1), s)); });
        isi.appendChild(lencana);
      }
      if (bagian.ajang) isi.appendChild(el('p', 'prestasi-ajang', bagian.ajang));
      kotak.appendChild(isi);
      return kotak;
    }

    function renderNarasumber() {
      var daftar = konten ? konten.narasumber : [];
      $('bagian-narasumber').hidden = !daftar.length;
      var wadah = $('daftar-narasumber');
      wadah.textContent = '';
      daftar.forEach(function (n) {
        var kartu = el('article', 'narasumber');
        var teks = el('div', 'narasumber-teks');
        var papan = el('div', 'narasumber-papan');
        var h = el('h3', null, n.nama_lengkap);
        if (n.contoh) { h.appendChild(document.createTextNode(' ')); h.appendChild(labelContoh()); }
        papan.appendChild(h);
        if (n.jabatan) papan.appendChild(el('p', 'jabatan', n.jabatan));
        if (n.foto_url) {
          // Foto potongan berlatar transparan di atas kotak biru: kepala keluar dari kotak, papan nama menutup bagian bawah.
          var figur = el('div', 'narasumber-figur');
          var bingkai = el('div', 'narasumber-bingkai');
          bingkai.appendChild(el('span', 'narasumber-latar'));
          var img = el('img', 'narasumber-foto');
          img.alt = 'Foto ' + n.nama_lengkap;
          img.loading = 'lazy';
          img.decoding = 'async';
          img.width = 800;
          img.height = 1000;
          aturGambar(img, n.foto_url, [400, 800], '(max-width: 640px) 90vw, 340px');
          bingkai.appendChild(img);
          figur.appendChild(bingkai);
          figur.appendChild(papan);
          kartu.appendChild(figur);
        } else {
          teks.appendChild(papan);
        }
        var prestasi = (n.prestasi_binaan || [])[0];
        if (prestasi) teks.appendChild(sorotPrestasi(prestasi));
        else if (n.ringkasan) teks.appendChild(el('p', 'narasumber-ringkasan', n.ringkasan));
        if (teks.children.length) kartu.appendChild(teks);
        wadah.appendChild(kartu);
      });
    }

    /* ---------- Ikon dan bantuan bersama bagian Fase 5 ---------- */

    var NS_SVG = 'http://www.w3.org/2000/svg';

    /** SVG garis satu warna dari daftar path; dibuat lewat DOM agar tidak perlu innerHTML. */
    function ikonGaris(paths, kelas) {
      var svg = document.createElementNS(NS_SVG, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      if (kelas) svg.setAttribute('class', kelas);
      paths.forEach(function (d) {
        var bentuk = d.charAt(0) === '@' ? d.slice(1).split(',') : null;
        var p;
        if (bentuk && bentuk[0] === 'c') {
          p = document.createElementNS(NS_SVG, 'circle');
          p.setAttribute('cx', bentuk[1]); p.setAttribute('cy', bentuk[2]); p.setAttribute('r', bentuk[3]);
        } else if (bentuk && bentuk[0] === 'r') {
          p = document.createElementNS(NS_SVG, 'rect');
          p.setAttribute('x', bentuk[1]); p.setAttribute('y', bentuk[2]); p.setAttribute('width', bentuk[3]); p.setAttribute('height', bentuk[3]); p.setAttribute('rx', bentuk[4]);
        } else {
          p = document.createElementNS(NS_SVG, 'path');
          p.setAttribute('d', d);
        }
        svg.appendChild(p);
      });
      return svg;
    }

    var IKON = {
      ig: ['@r,4,4,16,5', '@c,12,12,3.6', '@c,16.9,7.1,.5'],
      kanan: ['M9 6l6 6-6 6']
    };

    /** Ikon bulat jenis prestasi: Emas, Perak, Perunggu, atau Lainnya (bintang putih). */
    function ikonJenis(jenis) {
      var j = String(jenis || '').toLowerCase();
      var kelas = ['emas', 'perak', 'perunggu'].indexOf(j) >= 0 ? j : 'lainnya';
      var i = el('i', 'ikon-jenis ' + kelas);
      i.setAttribute('aria-hidden', 'true');
      if (kelas === 'lainnya') {
        var svg = document.createElementNS(NS_SVG, 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        var p = document.createElementNS(NS_SVG, 'path');
        p.setAttribute('d', 'M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z');
        p.setAttribute('fill', '#fff');
        svg.appendChild(p);
        i.appendChild(svg);
      }
      return i;
    }

    function itemPrestasi(p) {
      var li = el('li');
      li.appendChild(ikonJenis(p.jenis));
      var t = el('span', null, p.teks);
      li.appendChild(t);
      return li;
    }

    /** Siluet pengganti bila foto belum ada. */
    function siluet(kelas) {
      var svg = document.createElementNS(NS_SVG, 'svg');
      svg.setAttribute('viewBox', '0 0 96 110');
      svg.setAttribute('class', kelas);
      svg.setAttribute('aria-hidden', 'true');
      var kepala = document.createElementNS(NS_SVG, 'circle');
      kepala.setAttribute('cx', '48'); kepala.setAttribute('cy', '34'); kepala.setAttribute('r', '22');
      var badan = document.createElementNS(NS_SVG, 'path');
      badan.setAttribute('d', 'M8 110c2-26 18-44 40-44s38 18 40 44z');
      svg.appendChild(kepala);
      svg.appendChild(badan);
      return svg;
    }

    function gerakDikurangi() {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    }

    /** Animasi berhenti selama disentuh; dilanjutkan sesaat setelah jari dilepas. */
    function jedaSaatDisentuh(wadah) {
      if (wadah.getAttribute('data-jeda-siap')) return;
      wadah.setAttribute('data-jeda-siap', '1');
      var tunda = null;
      wadah.addEventListener('touchstart', function () { clearTimeout(tunda); wadah.classList.add('jeda'); }, { passive: true });
      wadah.addEventListener('touchend', function () {
        clearTimeout(tunda);
        tunda = setTimeout(function () { wadah.classList.remove('jeda'); }, 1500);
      }, { passive: true });
    }

    function judulDenganContoh(tag, kelas, teks, contoh) {
      var h = el(tag, kelas, teks);
      if (contoh) { h.appendChild(document.createTextNode(' ')); h.appendChild(labelContoh()); }
      return h;
    }

    /* ---------- Tutor ---------- */

    var BATAS_PRESTASI_KARTU = 3;

    /* Foto tutor diambil lewat server (getFotoTutor) agar latar transparan tidak menjadi hitam.
       Tanpa google.script.run (pratinjau lokal) atau bila gagal, pakai alamat gambar Drive. */
    // Satu permintaan per foto, dipakai bersama oleh kartu asli dan salinannya di pita.
    var fotoMemo = {};

    function ambilFotoTutor(id, selesai) {
      var m = fotoMemo[id];
      if (m && m.selesai) { selesai(m.data); return; }
      if (m) { m.tunggu.push(selesai); return; }
      m = fotoMemo[id] = { selesai: false, data: '', tunggu: [selesai] };
      function beres(data) {
        m.selesai = true;
        m.data = data;
        m.tunggu.forEach(function (fn) { fn(data); });
        m.tunggu = [];
      }
      google.script.run
        .withSuccessHandler(function (r) { beres(r && r.ok ? r.data : ''); })
        .withFailureHandler(function () { beres(''); })
        .getFotoTutor(id);
    }

    function fotoTutor(t, wadah, sizes) {
      if (t.foto_url) {
        var img = el('img');
        img.alt = 'Foto ' + t.nama_lengkap;
        img.decoding = 'async';
        var lewatDrive = function () { aturGambar(img, t.foto_url, [300, 600], sizes); };
        if (t.foto_id && window.google && google.script && google.script.run) {
          img.className = 'foto-muat';
          img.onload = function () { img.classList.remove('foto-muat'); };
          ambilFotoTutor(t.foto_id, function (data) { if (data) img.src = data; else lewatDrive(); });
        } else {
          img.loading = 'lazy';
          lewatDrive();
        }
        wadah.appendChild(img);
      } else {
        wadah.appendChild(siluet('siluet'));
      }
    }

    /** Kode badge dari room (atau jabatan): "SMP Matematika" menjadi MTK dan SMP. */
    function kodeRoomTutor(t) {
      var teks = String(t.room || t.jabatan || '');
      var jenjang = (teks.match(/\b(SD|SMP|SMA)\b/i) || [])[1];
      var bidang = /matematika/i.test(teks) ? 'MTK' : /\bIPA\b/i.test(teks) ? 'IPA' : /\bIPS\b/i.test(teks) ? 'IPS' : '';
      return jenjang && bidang ? { bidang: bidang, jenjang: jenjang.toUpperCase() } : null;
    }

    function kartuTutor(t) {
      var kartu = el('article', 'tutor-kartu bidang-' + (t.bidang || 'ipa'));
      var poster = el('div', 'tutor-poster');
      var judul = el('div', 'tutor-judul');
      judul.appendChild(judulDenganContoh('h3', null, t.nama_lengkap, t.contoh));
      if (t.jabatan) judul.appendChild(el('p', 'tutor-jabatan', t.jabatan));
      poster.appendChild(judul);
      var kode = kodeRoomTutor(t);
      if (kode) {
        var badge = el('span', 'tutor-badge');
        badge.setAttribute('aria-label', 'Room ' + (t.room || t.jabatan));
        badge.appendChild(el('b', null, kode.bidang));
        badge.appendChild(el('span', null, kode.jenjang));
        poster.appendChild(badge);
      }
      poster.appendChild(el('span', 'tutor-blok'));
      fotoTutor(t, poster, '(min-width: 640px) 230px, 60vw');
      kartu.appendChild(poster);

      var prestasi = t.prestasi || [];
      if (prestasi.length) {
        kartu.appendChild(el('p', 'tutor-label', 'Prestasi siswa binaan'));
        var ul = el('ul', 'tutor-prestasi');
        prestasi.slice(0, BATAS_PRESTASI_KARTU).forEach(function (p) { ul.appendChild(itemPrestasi(p)); });
        kartu.appendChild(ul);
      }
      var tombol = el('button', 'tutor-lagi', 'Lihat selengkapnya');
      tombol.type = 'button';
      tombol.appendChild(ikonGaris(IKON.kanan));
      tombol.addEventListener('click', function () { bukaDetailTutor(t, tombol); });
      kartu.appendChild(tombol);
      return kartu;
    }

    function bukaDetailTutor(t, pemicu) {
      var isi = $('detail-isi');
      isi.textContent = '';
      // Popup hanya nama dan prestasi lengkap (keputusan pemilik): tanpa foto dan ringkasan.
      var kepala = el('div', 'td-kepala bidang-' + (t.bidang || 'ipa'));
      var nama = el('div');
      var h = el('h2', null, t.nama_lengkap);
      h.id = 'detail-nama';
      nama.appendChild(h);
      if (t.room) nama.appendChild(el('span', 'td-room', 'Room ' + t.room));
      kepala.appendChild(nama);
      isi.appendChild(kepala);
      if ((t.prestasi || []).length) {
        isi.appendChild(el('h3', 'td-subjudul', 'Prestasi siswa binaan'));
        var ul = el('ul', 'td-prestasi');
        t.prestasi.forEach(function (p) { ul.appendChild(itemPrestasi(p)); });
        isi.appendChild(ul);
      }
      bukaLapisan('lapisan-detail', pemicu);
    }

    var slider = { geser: null, siap: false };

    function kartuAsli() {
      return slider.geser.querySelectorAll('.tutor-kartu:not(.salinan)');
    }

    function modePutar() {
      return slider.geser.classList.contains('mode-putar');
    }

    function lebarLangkah() {
      var k = slider.geser.firstElementChild;
      var jarak = parseFloat(getComputedStyle(slider.geser).columnGap);
      return k ? k.getBoundingClientRect().width + (isNaN(jarak) ? 12 : jarak) : 1;
    }

    /** scrollLeft yang membuat kartu k tepat di tengah. */
    function posisiTengah(k) {
      return k.offsetLeft + k.offsetWidth / 2 - slider.geser.clientWidth / 2;
    }

    /** Jarak satu putaran: dari kartu pertama salinan depan ke kartu asli pertama. */
    function lebarSatuPutaran() {
      var a = kartuAsli();
      if (!modePutar() || !a.length) return 0;
      return a[0].offsetLeft - slider.geser.firstElementChild.offsetLeft;
    }

    /** Menjaga posisi tetap di sekitar kartu asli; salinan di kiri dan kanan membuatnya tampak tanpa ujung. */
    function rapikanPutaran(pos) {
      var w = lebarSatuPutaran();
      if (!w) return pos;
      var awal = posisiTengah(kartuAsli()[0]);
      while (pos > awal + w / 2) pos -= w;
      while (pos < awal - w / 2) pos += w;
      return pos;
    }

    /** Posisi tengah dan lebar tiap kartu, diukur sekali (bukan tiap frame) agar geseran ringan. */
    function ukurKartu() {
      var g = slider.geser;
      slider.ukuran = Array.prototype.map.call(g.children, function (k) {
        return { kartu: k, tengah: k.offsetLeft + k.offsetWidth / 2, lebar: k.offsetWidth + 12 };
      });
      slider.lebarLayar = g.clientWidth;
    }

    /** Kartu di tengah utuh; makin jauh dari tengah makin kecil dan pudar. */
    function perbaruiFokus() {
      var g = slider.geser;
      if (!slider.ukuran || slider.ukuran.length !== g.children.length) ukurKartu();
      var tengah = g.scrollLeft + slider.lebarLayar / 2;
      slider.ukuran.forEach(function (u) {
        var d = Math.min(1, Math.abs(u.tengah - tengah) / u.lebar);
        u.kartu.style.opacity = String(1 - d * 0.45);
        u.kartu.style.transform = 'scale(' + (1 - d * 0.08).toFixed(4) + ')';
      });
    }

    function perbaruiSlider() {
      var g = slider.geser;
      if (!g || !g.firstElementChild) return;
      perbaruiFokus();
      var titik = $('tutor-titik');
      if (modePutar()) {
        titik.hidden = true;
        $('tutor-kiri').disabled = $('tutor-kanan').disabled = false;
        $('tutor-kiri').hidden = $('tutor-kanan').hidden = false;
        return;
      }
      var jumlah = kartuAsli().length;
      if (titik.children.length !== jumlah) {
        titik.textContent = '';
        for (var i = 0; i < jumlah; i++) titik.appendChild(el('span'));
      }
      var aktif = Math.max(0, Math.min(jumlah - 1, Math.round(g.scrollLeft / lebarLangkah())));
      Array.prototype.forEach.call(titik.children, function (d, j) { d.classList.toggle('aktif', j === aktif); });
      titik.hidden = jumlah < 2;
      $('tutor-kiri').disabled = aktif === 0;
      $('tutor-kanan').disabled = aktif === jumlah - 1;
      $('tutor-kiri').hidden = $('tutor-kanan').hidden = jumlah < 2;
    }

    function siapkanSlider() {
      slider.geser = $('daftar-tutor');
      if (slider.siap) return;
      slider.siap = true;
      var g = slider.geser;
      var tunggu = false;
      var tundaRapi = null;
      g.addEventListener('scroll', function () {
        if (otomatis.dijeda) otomatis.terakhir = Date.now();
        clearTimeout(tundaRapi);
        tundaRapi = setTimeout(function () {
          // Setelah digeser tangan, posisi dikembalikan diam-diam ke putaran tengah (tampilan sama persis).
          if (otomatis.bingkai || otomatis.sentuh || !modePutar()) return;
          var p = rapikanPutaran(g.scrollLeft);
          if (Math.abs(p - g.scrollLeft) > 1) g.scrollLeft = p;
        }, 250);
        if (tunggu) return;
        tunggu = true;
        window.requestAnimationFrame(function () { tunggu = false; perbaruiSlider(); });
      }, { passive: true });
      $('tutor-kiri').addEventListener('click', function () { g.scrollBy({ left: -lebarLangkah(), behavior: 'smooth' }); });
      $('tutor-kanan').addEventListener('click', function () { g.scrollBy({ left: lebarLangkah(), behavior: 'smooth' }); });
      window.addEventListener('resize', function () {
        ukurKartu();
        if (modePutar() && !otomatis.bingkai) g.scrollLeft = rapikanPutaran(g.scrollLeft);
        perbaruiSlider();
      });
      siapkanGeserOtomatis();
    }

    /*
     * Putaran tanpa ujung (keputusan pemilik): kartu asli diapit salinan lengkap di kiri dan kanan,
     * jadi saat pertama tampil tutor pertama di tengah dan tutor terakhir di kirinya.
     * Tiap tutor ditampilkan 4 detik (dihitung sejak bagian tutor terlihat), lalu geser ke tutor
     * berikutnya memakai geseran halus bawaan browser (dijalankan kartu grafis, mulus di ponsel). Berhenti saat bagian tutor disentuh; jalan lagi setelah bagian lain
     * disentuh, atau setelah 6 detik tanpa sentuhan. Hanya berjalan saat terlihat di layar.
     */
    var LAMA_TAMPIL_MS = 4000;
    // Perkiraan lama geseran bawaan browser; setelah itu posisi dirapikan ke putaran tengah.
    var DURASI_GESER_MS = 700;
    var DIAM_LANJUT_MS = 6000;
    var otomatis = { dijeda: false, sentuh: false, terakhir: 0, terlihat: false, bingkai: 0, timer: 0 };

    function bolehJalan() {
      return !otomatis.dijeda && otomatis.terlihat && !document.hidden &&
        !document.documentElement.classList.contains('fd-terbuka') && lebarSatuPutaran() > 0;
    }

    function kartuTengah() {
      var g = slider.geser;
      var tengah = g.scrollLeft + g.clientWidth / 2;
      var hasil = 0;
      var terdekat = Infinity;
      Array.prototype.forEach.call(g.children, function (k, i) {
        var d = Math.abs(k.offsetLeft + k.offsetWidth / 2 - tengah);
        if (d < terdekat) { terdekat = d; hasil = i; }
      });
      return hasil;
    }

    function hentikanPita() {
      clearTimeout(otomatis.timer);
      otomatis.timer = 0;
      clearTimeout(otomatis.bingkai);
      otomatis.bingkai = 0;
    }

    /** Geser halus ke posisi tujuan, lalu rapikan diam-diam bila sudah masuk salinan. */
    function geserKe(tujuan) {
      var g = slider.geser;
      g.scrollTo({ left: tujuan, behavior: 'smooth' });
      otomatis.bingkai = setTimeout(function () {
        otomatis.bingkai = 0;
        if (!otomatis.sentuh) g.scrollLeft = rapikanPutaran(g.scrollLeft);
      }, DURASI_GESER_MS);
    }

    function langkahBerikut() {
      if (!bolehJalan() || otomatis.bingkai) return;
      var berikut = slider.geser.children[kartuTengah() + 1];
      if (berikut) geserKe(posisiTengah(berikut));
    }

    /** Mulai hitung 4 detik dari sekarang, lalu geser, dan begitu seterusnya. */
    function jalankanPita() {
      hentikanPita();
      if (!bolehJalan()) return;
      otomatis.timer = setTimeout(function ulang() {
        langkahBerikut();
        otomatis.timer = setTimeout(ulang, LAMA_TAMPIL_MS + DURASI_GESER_MS);
      }, LAMA_TAMPIL_MS);
    }

    function siapkanGeserOtomatis() {
      var wadah = slider.geser.closest('.tutor-slider');
      var tenang = gerakDikurangi();
      if ('IntersectionObserver' in window) {
        if (!tenang) slider.geser.classList.add('kartu-siap-muncul');
        new IntersectionObserver(function (entri) {
          var terlihat = entri[0].isIntersecting;
          if (terlihat === otomatis.terlihat) return;
          otomatis.terlihat = terlihat;
          if (terlihat) {
            slider.geser.classList.add('kartu-muncul');
            jalankanPita();
          } else {
            hentikanPita();
          }
        }, { threshold: 0.25 }).observe(wadah);
      } else {
        otomatis.terlihat = true;
      }
      if (tenang) return;
      document.addEventListener('pointerdown', function (e) {
        if (wadah.contains(e.target)) {
          otomatis.dijeda = true;
          otomatis.sentuh = true;
          otomatis.terakhir = Date.now();
          hentikanPita();
        } else if (otomatis.dijeda) {
          otomatis.dijeda = false;
          jalankanPita();
        }
      }, true);
      function lepas() {
        if (!otomatis.sentuh) return;
        otomatis.sentuh = false;
        otomatis.terakhir = Date.now();
      }
      document.addEventListener('pointerup', lepas, true);
      document.addEventListener('pointercancel', lepas, true);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) jalankanPita(); });
      setInterval(function () {
        if (otomatis.dijeda && !otomatis.sentuh && Date.now() - otomatis.terakhir > DIAM_LANJUT_MS) {
          otomatis.dijeda = false;
          jalankanPita();
        } else if (!otomatis.timer && !otomatis.bingkai && bolehJalan()) {
          // Misalnya setelah popup ditutup: mulai lagi hitungan 4 detik.
          jalankanPita();
        }
      }, 1000);
    }

    function renderTutor() {
      var daftar = konten && konten.tutor ? konten.tutor : [];
      $('bagian-tutor').hidden = !daftar.length;
      var wadah = $('daftar-tutor');
      if (slider.geser) hentikanPita();
      wadah.classList.remove('mode-putar');
      wadah.textContent = '';
      var putar = daftar.length >= 2 && !gerakDikurangi();
      function tambah(t, i, salinan) {
        var k = kartuTutor(t);
        k.style.setProperty('--urut', String(i));
        if (salinan) {
          k.classList.add('salinan');
          k.setAttribute('aria-hidden', 'true');
          Array.prototype.forEach.call(k.querySelectorAll('button, a'), function (b) { b.tabIndex = -1; });
        }
        wadah.appendChild(k);
      }
      if (putar) daftar.forEach(function (t, i) { tambah(t, i, true); });
      daftar.forEach(function (t, i) { tambah(t, i, false); });
      if (putar) {
        daftar.forEach(function (t, i) { tambah(t, i, true); });
        wadah.classList.add('mode-putar');
      }
      siapkanSlider();
      window.requestAnimationFrame(function () {
        var a = kartuAsli();
        if (a.length) wadah.scrollLeft = posisiTengah(a[0]);
        ukurKartu();
        perbaruiSlider();
      });
    }

    /* ---------- Apa itu Genio ---------- */

    /** Teks dengan tanda **...** menjadi teks biasa dan huruf tebal, tanpa innerHTML. */
    function isiTeksTebal(wadah, teks) {
      wadah.textContent = '';
      String(teks).split('**').forEach(function (bagian, i) {
        if (!bagian) return;
        wadah.appendChild(i % 2 ? el('b', null, bagian) : document.createTextNode(bagian));
      });
    }

    /** Digit diganti angka acak, lalu berhenti satu per satu ke nilai asli. Karakter lain (+, spasi) tetap. */
    function acakAngka(dd, akhir, lama) {
      var mulai = Date.now();
      var t = setInterval(function () {
        var jalan = (Date.now() - mulai) / lama;
        if (jalan >= 1) { clearInterval(t); dd.textContent = akhir; return; }
        var tetap = Math.floor(jalan * akhir.length);
        dd.textContent = akhir.replace(/\d/g, function (d, i) { return i < tetap ? d : String(Math.floor(Math.random() * 10)); });
      }, 45);
    }

    function animasiProfil() {
      var kotak = document.querySelector('.profil-kotak');
      if (!kotak || kotak.classList.contains('profil-tampil') || gerakDikurangi() || !('IntersectionObserver' in window)) return;
      kotak.classList.add('profil-siap');
      var pengamat = new IntersectionObserver(function (e) {
        if (!e[0].isIntersecting) return;
        pengamat.disconnect();
        kotak.classList.add('profil-tampil');
        kotak.classList.remove('profil-siap');
      }, { threshold: 0.2 });
      pengamat.observe(kotak);
    }

    function animasiAngka(dl) {
      if (gerakDikurangi() || !('IntersectionObserver' in window) || !dl.children.length) return;
      dl.classList.add('angka-siap');
      var pengamat = new IntersectionObserver(function (entri) {
        if (!entri[0].isIntersecting) return;
        pengamat.disconnect();
        var urutan = Array.prototype.slice.call(dl.children).sort(function () { return Math.random() - 0.5; });
        urutan.forEach(function (div, i) {
          setTimeout(function () {
            div.classList.add('tampil');
            var dd = div.querySelector('dd');
            acakAngka(dd, dd.textContent, 700 + Math.random() * 600);
          }, i * 180 + Math.random() * 120);
        });
      }, { threshold: 0.4 });
      pengamat.observe(dl);
    }

    function renderProfil() {
      var p = konten ? konten.profil : null;
      $('bagian-profil').hidden = !p;
      if (!p) return;
      var judul = $('judul-profil');
      judul.textContent = p.judul || 'Apa itu Genio Institute?';
      // Lembar lama tanpa kunci subjudul memakai teks bawaan; kunci yang dikosongkan menyembunyikannya.
      var sub = p.subjudul === undefined ? 'Lembaga bimbingan olimpiade' : p.subjudul;
      $('profil-sub').textContent = sub;
      $('profil-sub').hidden = !sub;
      var logo = $('profil-logo');
      var lambang = document.querySelector('.ajakan-ikon img');
      if (!logo.firstChild && lambang) logo.appendChild(lambang.cloneNode());
      if (p.contoh) { judul.appendChild(document.createTextNode(' ')); judul.appendChild(labelContoh()); }
      var dl = $('profil-angka');
      dl.textContent = '';
      [1, 2, 3, 4].forEach(function (n) {
        if (!p['angka_' + n]) return;
        var div = el('div');
        div.appendChild(el('dt', null, p['label_' + n] || ''));
        div.appendChild(el('dd', null, p['angka_' + n]));
        dl.appendChild(div);
      });
      dl.hidden = !dl.children.length;
      dl.style.setProperty('--kolom', String(Math.max(1, dl.children.length)));
      animasiProfil();
      animasiAngka(dl);
      // Paragraf inti dan paragraf lanjutan digabung menjadi satu paragraf (keputusan pemilik).
      var teks = [p.paragraf_1, p.paragraf_2].filter(Boolean).join(' ');
      isiTeksTebal($('profil-teks'), teks);
      $('profil-teks').hidden = !teks;
    }

    /* ---------- Cabang ---------- */

    // Pin bergaya logo Google Maps: bagian merah, biru, kuning, hijau, dengan lubang putih di tengah.
    var IKON_MAPS = '<svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="klip-pin">' +
      '<path d="M12 1.6a7.4 7.4 0 0 0-7.4 7.4c0 5.4 7.4 13.4 7.4 13.4s7.4-8 7.4-13.4A7.4 7.4 0 0 0 12 1.6z"/></clipPath></defs>' +
      '<g clip-path="url(#klip-pin)"><rect x="0" y="0" width="24" height="24" fill="#34A853"/>' +
      '<polygon points="12,-2 26,-2 26,10 12,9" fill="#EA4335"/><polygon points="12,-2 -2,-2 -2,9 7.2,11.6 12,9" fill="#4285F4"/>' +
      '<polygon points="-2,9 7.2,11.6 10.8,16.5 -2,19" fill="#FBBC04"/></g><circle cx="12" cy="9" r="2.7" fill="#fff"/></svg>';

    /** Tombol ikon bulat berwarna merek: Maps, WhatsApp hijau, Instagram gradien. */
    function tautanIkon(href, label, ikon, merek) {
      var a = tautanLuar('', href, 'ikon-bulat ' + merek);
      a.setAttribute('aria-label', label);
      if (typeof ikon === 'string') a.innerHTML = ikon;
      else a.appendChild(ikonGaris(ikon));
      return a;
    }

    function namaPendekCabang(nama) {
      return String(nama || '').replace(/^genio( institute)?\s*/i, '') || nama;
    }

    /*
     * Garis bergradasi dari bulatan di bawah kotak Apa itu Genio, turun lalu bercabang ke bulatan di atas
     * tiap kartu cabang (sudut membulat). Digambar ulang saat ukuran layar atau posisi kartu berubah.
     */
    function gambarGarisCabang() {
      var sec = $('bagian-cabang');
      var svg = $('cabang-garis');
      var kotak = document.querySelector('.profil-kotak');
      var kartu = sec.querySelectorAll('.cabang-kartu');
      var aktif = !sec.hidden && kotak && !$('bagian-profil').hidden && kartu.length > 0;
      if (kotak) kotak.classList.toggle('ada-cabang', !!aktif);
      svg.style.display = aktif ? '' : 'none';
      if (!aktif) return;
      var s = sec.getBoundingClientRect();
      var k = kotak.getBoundingClientRect();
      var x0 = k.left + k.width / 2 - s.left;
      var y0 = k.bottom - s.top;
      var ys = kartu[0].getBoundingClientRect().top - s.top;
      var ym = (y0 + ys) / 2;
      var d = '';
      Array.prototype.forEach.call(kartu, function (c) {
        var b = c.getBoundingClientRect();
        var x = b.left + b.width / 2 - s.left;
        var arah = x < x0 ? -1 : 1;
        var r = Math.min(14, Math.abs(x - x0) / 2, (ys - ym) - 1);
        if (Math.abs(x - x0) < 2) { d += 'M' + x0 + ',' + y0 + ' V' + ys + ' '; return; }
        d += 'M' + x0 + ',' + y0 + ' V' + (ym - r) + ' Q' + x0 + ',' + ym + ' ' + (x0 + arah * r) + ',' + ym +
          ' H' + (x - arah * r) + ' Q' + x + ',' + ym + ' ' + x + ',' + (ym + r) + ' V' + ys + ' ';
      });
      svg.setAttribute('width', s.width);
      svg.setAttribute('height', Math.max(1, ys));
      svg.innerHTML = '<defs><linearGradient id="gradasi-cabang" gradientUnits="userSpaceOnUse" x1="0" y1="' + y0 + '" x2="0" y2="' + ys + '">' +
        '<stop offset="0" stop-color="#1399D8"/><stop offset="1" stop-color="#16C7B8"/></linearGradient></defs>' +
        '<path d="' + d + '" fill="none" stroke="url(#gradasi-cabang)" stroke-width="4" stroke-linecap="round"/>';
    }

    var garisCabangSiap = false;
    function siapkanGarisCabang() {
      window.requestAnimationFrame(gambarGarisCabang);
      setTimeout(gambarGarisCabang, 1300);
      if (garisCabangSiap) return;
      garisCabangSiap = true;
      window.addEventListener('resize', gambarGarisCabang);
      // Kartu dan kotak profil punya animasi muncul (geser); gambar ulang setelah animasinya selesai.
      document.addEventListener('transitionend', function (e) {
        if (e.target.closest && (e.target.closest('#bagian-cabang') || e.target.closest('#bagian-profil'))) gambarGarisCabang();
      });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(gambarGarisCabang);
    }

    function renderCabang() {
      var daftar = (konten && konten.cabang ? konten.cabang : []).filter(function (c) { return c.nama && (c.alamat || c.link_maps || c.wa_admin || c.instagram); });
      if (!bagianTampil('cabang')) daftar = [];
      $('bagian-cabang').hidden = !daftar.length;
      var wadah = $('daftar-cabang');
      wadah.textContent = '';
      daftar.forEach(function (c) {
        var kartu = el('article', 'cabang-kartu');
        var simpul = el('span', 'simpul');
        simpul.setAttribute('aria-hidden', 'true');
        kartu.appendChild(simpul);
        if (c.logo_data || c.logo_url) {
          var img = el('img', 'cabang-logo');
          img.alt = c.nama;
          img.loading = 'lazy';
          if (c.logo_data) img.src = c.logo_data;
          else aturGambar(img, c.logo_url, [300], '140px');
          kartu.appendChild(img);
          if (c.contoh) kartu.appendChild(labelContoh());
        } else {
          kartu.appendChild(judulDenganContoh('h3', null, c.nama, c.contoh));
        }
        if (c.alamat) kartu.appendChild(el('p', 'cabang-alamat', c.alamat));
        var aksi = el('div', 'cabang-aksi');
        var pendek = namaPendekCabang(c.nama);
        if (/^https:\/\//.test(c.link_maps)) aksi.appendChild(tautanIkon(c.link_maps, 'Buka lokasi ' + pendek + ' di Google Maps', IKON_MAPS, 'merek-maps'));
        if (c.wa_admin) aksi.appendChild(tautanIkon(tautanWa(c.wa_admin), 'WhatsApp admin ' + pendek, FormDaftar.IKON_WA, 'merek-wa'));
        if (c.instagram) aksi.appendChild(tautanIkon('https://www.instagram.com/' + encodeURIComponent(String(c.instagram).replace(/^@/, '')) + '/', 'Instagram ' + pendek, IKON.ig, 'merek-ig'));
        if (aksi.children.length) kartu.appendChild(aksi);
        wadah.appendChild(kartu);
      });
      siapkanGarisCabang();
    }

    /* ---------- Prestasi siswa ---------- */

    var BATAS_PRESTASI_GULIR = 10;
    var BARIS_JENDELA = 5;

    function teksPrestasi(p) {
      return p.prestasi || [p.lomba, p.bidang, p.jenjang, p.tingkat].filter(Boolean).join(' ');
    }

    function barisPrestasi(p, denganTahun, nomor) {
      var li = el('li');
      if (nomor) li.appendChild(el('span', 'peringkat', String(nomor)));
      li.appendChild(ikonJenis(p.medali));
      var t = el('div', 'pr-teks');
      t.appendChild(judulDenganContoh('strong', null, p.nama_siswa, p.contoh));
      t.appendChild(el('span', null, teksPrestasi(p)));
      if (!denganTahun && p.sekolah) t.appendChild(el('small', null, p.sekolah));
      li.appendChild(t);
      if (denganTahun && p.tahun) li.appendChild(el('span', 'pr-tahun', p.tahun));
      return li;
    }

    var WARNA_MEDALI = { Emas: ['#FFE58A', '#F2B91F', '#B9790B'], Perak: ['#F4F6F9', '#B8C1CC', '#76808D'], Perunggu: ['#F8CDA4', '#C9803F', '#874717'] };

    /** Titik segi enam (sudut di atas dan bawah) sebagai teks "x,y". */
    function titikSegiEnam(cx, cy, r) {
      return [0, 1, 2, 3, 4, 5].map(function (i) {
        var a = Math.PI / 3 * i + Math.PI / 6;
        return (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
      });
    }

    /** Lencana permata: sisi luar berfaset terang-gelap, inti bergradasi, angka putih, kilau bintang kecil. */
    function svgMedali(jenis, jumlah, i) {
      var w = WARNA_MEDALI[jenis];
      var id = 'md' + i;
      var luar = titikSegiEnam(50, 58, 38);
      var dalam = titikSegiEnam(50, 58, 26);
      var faset = '';
      [0.55, 0.35, 0.2, 0.5, 0.7, 0.4].forEach(function (op, j) {
        faset += '<polygon points="' + luar[j] + ' ' + luar[(j + 1) % 6] + ' ' + dalam[(j + 1) % 6] + ' ' + dalam[j] +
          '" fill="' + (j < 3 ? w[2] : w[0]) + '" opacity="' + op + '"/>';
      });
      return '<svg viewBox="0 0 100 110" aria-hidden="true"><defs>' +
        '<radialGradient id="r' + id + '" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="' + w[0] + '"/><stop offset=".55" stop-color="' + w[1] + '"/><stop offset="1" stop-color="' + w[2] + '"/></radialGradient>' +
        '<linearGradient id="l' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + w[0] + '"/><stop offset="1" stop-color="' + w[2] + '"/></linearGradient>' +
        '<linearGradient id="k' + id + '" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
        '<clipPath id="c' + id + '"><polygon points="' + luar.join(' ') + '"/></clipPath></defs>' +
        '<polygon points="' + luar.join(' ') + '" fill="url(#l' + id + ')"/>' + faset +
        '<polygon points="' + dalam.join(' ') + '" fill="url(#r' + id + ')"/>' +
        '<text x="50" y="67" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="24" fill="#fff" stroke="' + w[2] + '" stroke-width="1.2" style="paint-order: stroke">' + jumlah + '</text>' +
        '<g clip-path="url(#c' + id + ')"><rect class="medali-kilau" x="-30" y="0" width="22" height="110" fill="url(#k' + id + ')"/></g>' +
        '<path d="M80 18l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="' + w[1] + '"/></svg>';
    }

    function renderPrestasi() {
      var daftar = konten && konten.prestasi ? konten.prestasi : [];
      $('bagian-prestasi').hidden = !daftar.length;
      if (!daftar.length) return;

      var hitung = { Emas: 0, Perak: 0, Perunggu: 0 };
      daftar.forEach(function (p) { if (hitung[p.medali] != null) hitung[p.medali]++; });
      var ringkas = $('prestasi-ringkas');
      ringkas.textContent = '';
      // Medali permata segi enam (opsi 5 pemilik), berisi jumlah dan berkilau sesekali.
      Object.keys(hitung).forEach(function (k, i) {
        var d = el('div', 'medali');
        d.style.setProperty('--urut', String(i));
        d.setAttribute('role', 'img');
        d.setAttribute('aria-label', hitung[k] + ' medali ' + k.toLowerCase());
        d.innerHTML = svgMedali(k, hitung[k], i);
        d.appendChild(el('span', 'medali-nama', k));
        ringkas.appendChild(d);
      });

      $('prestasi-total').textContent = 'Total ' + daftar.length + ' prestasi';

      // Papan prestasi: daftar bernomor tanpa animasi. Bila lebih dari 5 baris, kotak digulir biasa;
      // setelah mentok di bawah, guliran berlanjut ke halaman (keputusan pemilik).
      var teratas = daftar.slice(0, BATAS_PRESTASI_GULIR);
      var jendela = $('prestasi-jendela');
      jendela.textContent = '';
      jendela.scrollTop = 0;
      jendela.classList.toggle('bergulir', teratas.length > BARIS_JENDELA);
      var ul = el('ul', 'prestasi-daftar');
      teratas.forEach(function (p, i) { ul.appendChild(barisPrestasi(p, true, i + 1)); });
      jendela.appendChild(ul);
    }

    var tahunPrestasi = '';

    function isiPopupPrestasi() {
      var daftar = konten && konten.prestasi ? konten.prestasi : [];
      var semuaTahun = [];
      daftar.forEach(function (p) { if (p.tahun && semuaTahun.indexOf(p.tahun) < 0) semuaTahun.push(p.tahun); });
      semuaTahun.sort().reverse();
      var pilihan = semuaTahun.concat(['Semua']);
      if (pilihan.indexOf(tahunPrestasi) < 0) tahunPrestasi = pilihan[0];

      var wadahTahun = $('pp-tahun');
      wadahTahun.textContent = '';
      pilihan.forEach(function (th) {
        var b = el('button', 'pp-pil', th);
        b.type = 'button';
        b.setAttribute('aria-pressed', String(th === tahunPrestasi));
        b.addEventListener('click', function () { tahunPrestasi = th; isiPopupPrestasi(); });
        wadahTahun.appendChild(b);
      });

      var isi = $('pp-isi');
      isi.textContent = '';
      var grup = tahunPrestasi === 'Semua' ? semuaTahun : [tahunPrestasi];
      var tanpaTahun = daftar.filter(function (p) { return !p.tahun; });
      grup.forEach(function (th) {
        tampilGrup(isi, th, daftar.filter(function (p) { return p.tahun === th; }));
      });
      if (tahunPrestasi === 'Semua' && tanpaTahun.length) tampilGrup(isi, 'Lainnya', tanpaTahun);
    }

    function tampilGrup(isi, judul, baris) {
      var h = el('h3', 'pp-grup');
      h.appendChild(el('span', null, judul));
      h.appendChild(el('span', null, baris.length + ' prestasi'));
      isi.appendChild(h);
      var ul = el('ul', 'pp-daftar');
      baris.forEach(function (p) { ul.appendChild(barisPrestasi(p, false)); });
      isi.appendChild(ul);
    }

    function bukaPopupPrestasi() {
      tahunPrestasi = '';
      isiPopupPrestasi();
      bukaLapisan('lapisan-prestasi', $('tombol-prestasi'));
    }

    /* ---------- Testimoni ---------- */

    function inisial(nama) {
      var kata = String(nama || '').replace(/^(ibu|bapak|bu|pak)\s+/i, '').split(/\s+/).filter(Boolean);
      return ((kata[0] || '?').charAt(0) + (kata[1] ? kata[1].charAt(0) : '')).toUpperCase();
    }

    function kartuTestimoni(t) {
      var kartu = el('figure', 'testi-kartu');
      var kepala = el('figcaption', 'testi-kepala');
      var av = el('span', 'testi-av');
      if (t.foto_url) {
        var img = el('img');
        img.alt = '';
        img.loading = 'lazy';
        aturGambar(img, t.foto_url, [96], '32px');
        av.appendChild(img);
      } else {
        av.textContent = inisial(t.nama);
      }
      kepala.appendChild(av);
      var nama = el('div');
      nama.appendChild(judulDenganContoh('b', null, t.nama, t.contoh));
      if (t.keterangan) nama.appendChild(el('small', null, t.keterangan));
      kepala.appendChild(nama);
      kartu.appendChild(kepala);
      var isi = el('div', 'testi-isi');
      var gelembung = el('blockquote', 'testi-gelembung', t.kutipan);
      if (t.jam) gelembung.appendChild(el('span', 'testi-jam', t.jam));
      isi.appendChild(gelembung);
      kartu.appendChild(isi);
      return kartu;
    }

    function renderTestimoni() {
      var daftar = (konten && konten.testimoni ? konten.testimoni : []).filter(function (t) { return t.kutipan; });
      $('bagian-testimoni').hidden = !daftar.length;
      var jalur = $('testi-jalur');
      jalur.textContent = '';
      var gulir = daftar.length > 1 && !gerakDikurangi();
      jalur.classList.toggle('bergulir', gulir);
      var pita = el('div', 'testi-pita');
      daftar.forEach(function (t) { pita.appendChild(kartuTestimoni(t)); });
      if (gulir) {
        daftar.forEach(function (t) {
          var salinan = kartuTestimoni(t);
          salinan.setAttribute('aria-hidden', 'true');
          pita.appendChild(salinan);
        });
        pita.style.animationDuration = Math.round(daftar.length * 12) + 's';
        jedaSaatDisentuh(jalur);
      }
      jalur.appendChild(pita);
    }

    /* ---------- Ajakan bergabung ---------- */

    function renderAjakan() {
      var cabang = (konten && konten.cabang ? konten.cabang : []).filter(function (c) { return c.wa_admin; });
      if (!bagianTampil('ajakan')) cabang = [];
      $('bagian-ajakan').hidden = !cabang.length;
      if (!cabang.length) return;
      setTeks('judul-ajakan', peng('cta_judul'));
      setTeks('ajakan-kalimat', peng('cta_kalimat'));
      var wadah = $('ajakan-cabang');
      wadah.textContent = '';
      cabang.forEach(function (c) {
        var a = tautanLuar('', tautanWa(c.wa_admin, peng('cta_pesan_wa')), 'ajakan-wa');
        a.innerHTML = FormDaftar.IKON_WA;
        a.appendChild(document.createTextNode(namaPendekCabang(c.nama)));
        a.setAttribute('aria-label', 'Chat WhatsApp admin ' + namaPendekCabang(c.nama));
        wadah.appendChild(a);
      });
      wadah.classList.toggle('satu', cabang.length === 1);
    }

    /* ---------- Footer ---------- */

    function renderKaki() {
      var wa = peng('narahubung_wa');
      $('tautan-narahubung').href = tautanWa(wa);
      $('narahubung-nomor').textContent = formatWa(wa);
      $('narahubung-nama').textContent = '(' + peng('narahubung_nama') + ')';
      ['instagram_1', 'instagram_2'].forEach(function (k, i) {
        var akun = peng(k);
        var t = $('tautan-ig-' + (i + 1));
        t.hidden = !akun;
        t.href = 'https://www.instagram.com/' + encodeURIComponent(akun) + '/';
        t.textContent = '@' + akun;
      });
    }

    /* ---------- Tombol floating ---------- */

    function tombolBilah(teks, aktif) {
      var b = el('button', 'tombol tombol-utama', teks);
      b.type = 'button';
      if (!aktif) b.disabled = true;
      return b;
    }

    /** Fase belum_buka, daftar, dan tutup. Fase hari_h dan selesai dibuat di Fase 6. */
    function renderBilah() {
      var wadah = $('bilah');
      wadah.textContent = '';
      var isi = el('div', 'bilah-isi');
      var info = el('div', 'bilah-info');
      var nama = peng('narahubung_nama');
      var aksi;

      if (!config) {
        info.appendChild(el('strong', null, 'Status pendaftaran belum terbaca'));
        info.appendChild(el('span', null, 'Hubungi narahubung bila ada kendala.'));
        aksi = tautanLuar('Hubungi narahubung', tautanWa(peng('narahubung_wa')), 'tombol tombol-utama');
      } else if (config.fase === 'belum_buka') {
        info.appendChild(el('strong', null, 'Gratis'));
        info.appendChild(el('span', null, 'Bonus ' + peng('bonus_teks')));
        aksi = tombolBilah('Pendaftaran dibuka ' + formatWib(config.pendaftaran_buka, false), false);
      } else if (config.fase === 'daftar') {
        var t = teksHitungMundur();
        info.appendChild(el('strong', null, 'Gratis'));
        info.appendChild(el('span', null, t ? t.awal + t.tebal + t.akhir : 'Bonus ' + peng('bonus_teks')));
        aksi = tombolBilah('Daftar', true);
        aksi.classList.remove('tombol-utama');
        aksi.classList.add('tombol-detak', 'tombol-daftar');
        aksi.addEventListener('click', bukaForm);
      } else {
        info.appendChild(el('strong', null, 'Pendaftaran Ditutup'));
        var kecil = el('span', null, 'Sudah daftar tapi belum masuk grup? ');
        kecil.appendChild(tautanLuar('Hubungi ' + nama, tautanWa(peng('narahubung_wa'))));
        info.appendChild(kecil);
        aksi = tombolBilah('Pendaftaran Ditutup', false);
      }
      isi.appendChild(info);
      isi.appendChild(aksi);
      wadah.appendChild(isi);
    }

    /** Bila berkas form tidak termuat (misalnya tertempel tidak utuh), tampilkan pesan, jangan diam. */
    function bukaForm() {
      try {
        FormDaftar.buka();
      } catch (err) {
        var info = document.querySelector('.bilah-info span');
        if (info) {
          info.textContent = 'Form belum bisa dibuka. Muat ulang halaman, atau hubungi ' + peng('narahubung_nama') + '. (' + (err && err.message ? err.message : err) + ')';
        }
        if (window.console) console.error(err);
      }
    }

    /* ---------- Lapisan ---------- */

    var pemicuLapisan = {};

    function bukaLapisan(id, pemicu) {
      var l = $(id);
      pemicuLapisan[id] = pemicu || document.activeElement;
      l.hidden = false;
      document.documentElement.classList.add('fd-terbuka');
      var fokus = l.querySelector('input, [data-tutup]');
      if (fokus) fokus.focus();
    }

    function tutupLapisan(id) {
      var l = $(id);
      if (l.hidden) return;
      l.hidden = true;
      document.documentElement.classList.remove('fd-terbuka');
      var p = pemicuLapisan[id];
      if (p && p.focus) p.focus();
    }

    function siapkanLapisan(id) {
      var l = $(id);
      l.addEventListener('click', function (e) {
        // Panel admin hanya ditutup lewat tombolnya agar tidak tertutup karena ketukan tak sengaja.
        var latar = e.target === l && id !== 'lapisan-admin';
        if (latar || e.target.closest('[data-tutup]')) tutupLapisan(id);
      });
      l.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') tutupLapisan(id);
      });
    }

    /* ---------- Admin ---------- */

    function bukaAdmin() {
      bukaLapisan('lapisan-admin', $('tombol-admin'));
      PanelAdmin.buka($('admin-akar'));
    }

    function siapkanAdmin() {
      $('tombol-admin').addEventListener('click', bukaAdmin);
    }

    /* ---------- Animasi muncul saat digulir ---------- */

    var SASARAN_MUNCUL = '.strip-tanggal, .info-kartu, .hitung-mundur, .narahubung, .bagian > h2, .agenda li, .narasumber, ' +
      '.tutor-slider, .cabang-kartu, .papan, .testi-jalur, .ajakan, .kaki';

    /** Hanya elemen yang awalnya di luar layar yang dianimasikan; yang sudah terlihat dibiarkan. */
    function siapkanMunculGulir() {
      if (!('IntersectionObserver' in window)) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var pengamat = new IntersectionObserver(function (entri) {
        entri.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.classList.add('terlihat');
          pengamat.unobserve(e.target);
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      Array.prototype.forEach.call(document.querySelectorAll(SASARAN_MUNCUL), function (n) {
        if (n.closest('[hidden]') || n.getBoundingClientRect().top < window.innerHeight) return;
        n.classList.add('gulir-muncul');
        pengamat.observe(n);
      });
    }

    /* ---------- Muat ulang bila gagal ---------- */

    function renderSemua() {
      window.APP_CONFIG = config;
      isiPembuka();
      isiHitungMundur();
      renderAgenda();
      renderNarasumber();
      renderTutor();
      renderProfil();
      renderCabang();
      renderPrestasi();
      renderTestimoni();
      renderAjakan();
      renderKaki();
      renderBilah();
      $('pita-contoh').hidden = !(konten && konten.ada_contoh);
      $('galat-konten').hidden = !!(konten && config);
    }

    function muatUlang() {
      var tombol = $('tombol-muat-ulang');
      if (!window.google || !google.script || !google.script.run) return;
      tombol.disabled = true;
      tombol.textContent = 'Memuat…';
      var sisa = 2;
      function selesai() {
        if (--sisa > 0) return;
        tombol.disabled = false;
        tombol.textContent = 'Muat ulang';
        renderSemua();
      }
      google.script.run.withSuccessHandler(function (r) { if (r && r.ok) config = r.data; selesai(); }).withFailureHandler(selesai).getConfig();
      google.script.run.withSuccessHandler(function (r) { if (r && r.ok) konten = r.data; selesai(); }).withFailureHandler(selesai).getContent();
    }

    renderSemua();
    siapkanMunculGulir();
    pasTanggal();
    window.addEventListener('resize', pasTanggal);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(pasTanggal);
    siapkanLapisan('lapisan-poster');
    siapkanLapisan('lapisan-detail');
    siapkanLapisan('lapisan-prestasi');
    $('tombol-prestasi').addEventListener('click', bukaPopupPrestasi);
    siapkanLapisan('lapisan-admin');
    siapkanAdmin();
    $('tombol-poster').addEventListener('click', function () {
      var besar = $('poster-besar');
      besar.src = urlGambar(konten.poster_url, 1600);
      pasangCadangan(besar, konten.poster_url, 1600);
      bukaLapisan('lapisan-poster', $('tombol-poster'));
    });
    $('tombol-muat-ulang').addEventListener('click', muatUlang);

    if (param.form === 'daftar') bukaForm();
    else if (param.admin === '1') bukaAdmin();
  })();
</script>
